[project]
name = "glyphh-collective"
version = "0.1.0"
description = "A council of models for Claude: Claude, Codex, Gemini and Grok through your signed-in CLIs, as one MCP tool."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2"]

[project.scripts]
glyphh-collective = "collective.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]
